<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/svg+xml" href="app-icon.svg">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="app-icon.png">
<title>Decorative Pro</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#17202a;--muted:#68737d;--line:#e5e7eb;--accent:#2563eb;--danger:#dc2626;--shadow:0 8px 28px #0000000d}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{min-height:100vh}.top{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;font-size:20px}.menuBtn{width:42px;height:42px;border-radius:12px;background:#eef2ff;color:var(--accent);font-size:22px}
main{max-width:1000px;margin:auto;padding:18px 16px 40px}.hero{background:linear-gradient(135deg,#111827,#334155);color:#fff;border-radius:24px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}.hero small{opacity:.75}.quote{margin-top:10px;font-size:15px;line-height:1.9}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}.stat b{display:block;font-size:22px;margin-top:7px}.muted{color:var(--muted);font-size:13px}.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin:22px 0 12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.primary{background:var(--accent);color:#fff;padding:11px 15px;border-radius:12px}.secondary{background:#eef2f7;color:var(--text);padding:11px 15px;border-radius:12px}.danger{background:#fee2e2;color:var(--danger);padding:10px 13px;border-radius:10px}.list{display:grid;gap:10px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.badge{padding:5px 9px;border-radius:999px;background:#e0f2fe;color:#0369a1;font-size:12px}.empty{text-align:center;padding:35px 15px;color:var(--muted)}.drawer{position:fixed;inset:0;z-index:30;display:none}.drawer.open{display:block}.shade{position:absolute;inset:0;background:#0008}.panel{position:absolute;right:0;top:0;bottom:0;width:min(330px,88vw);background:var(--card);padding:20px;overflow:auto;animation:slide .18s ease}.nav{display:grid;gap:8px;margin-top:18px}.nav button{text-align:right;padding:12px 13px;border-radius:12px;background:transparent;color:var(--text)}.nav button:hover{background:#f1f5f9}.menuGroup{border:1px solid var(--line);border-radius:15px;overflow:hidden;background:color-mix(in srgb,var(--card) 92%,var(--accent) 8%)}.menuGroup summary{list-style:none;cursor:pointer;padding:13px 14px;font-weight:800;display:flex;align-items:center;justify-content:space-between}.menuGroup summary::-webkit-details-marker{display:none}.menuGroup summary:after{content:'⌄';font-size:16px;transition:.15s}.menuGroup[open] summary:after{transform:rotate(180deg)}.menuSub{display:grid;gap:4px;padding:0 7px 7px}.menuSub button{padding:10px 11px;font-size:14px}.modal{position:fixed;inset:0;background:#0008;z-index:40;display:none;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.dialog{background:var(--card);width:min(600px,100%);max-height:90vh;overflow:auto;border-radius:22px;padding:20px}.form{display:grid;gap:12px}.field{display:grid;gap:6px}.field label{font-size:13px;color:var(--muted)}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px;background:var(--card);color:var(--text)}textarea{min-height:90px;resize:vertical}.formActions{display:flex;justify-content:flex-start;gap:8px;margin-top:5px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 16px;border-radius:12px;display:none;z-index:60}.toast.show{display:block}@keyframes slide{from{transform:translateX(20px);opacity:.5}to{transform:none;opacity:1}}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>

<style>
:root{
 --accent:#5b5cf0;--accent2:#7c3aed;--glass:rgba(255,255,255,.72);
 --shadow2:0 18px 50px rgba(15,23,42,.10);
}
body{position:relative;background:
 radial-gradient(circle at 12% 0%,rgba(91,92,240,.13),transparent 27%),
 radial-gradient(circle at 92% 18%,rgba(124,58,237,.11),transparent 29%),
 radial-gradient(circle at 55% 100%,rgba(37,99,235,.07),transparent 30%),var(--bg);
 transition:background .25s,color .25s}
.top{backdrop-filter:blur(16px);background:color-mix(in srgb,var(--card) 84%,transparent);
 box-shadow:0 1px 0 var(--line);height:70px}
.brand{display:flex;align-items:center;gap:10px;letter-spacing:-.4px}
.brandLogo{width:40px;height:40px;border-radius:12px;display:block;object-fit:cover;box-shadow:0 8px 20px rgba(91,92,240,.25)}
.menuBtn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
 box-shadow:0 8px 18px rgba(91,92,240,.22);transition:.2s}
.menuBtn:active,.primary:active,.secondary:active{transform:scale(.97)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.28;background-image:linear-gradient(rgba(100,116,139,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(100,116,139,.055) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(to bottom,black,transparent 75%)}
main{padding-top:24px}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(15,23,42,.97),rgba(49,46,129,.94) 55%,rgba(91,33,182,.92));
 box-shadow:0 20px 55px rgba(49,46,129,.22);border:1px solid rgba(255,255,255,.08)}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 0 58%,rgba(255,255,255,.035) 58.2% 58.5%,transparent 58.7% 100%),linear-gradient(35deg,transparent 0 72%,rgba(255,255,255,.025) 72.2% 72.5%,transparent 72.7%);pointer-events:none}
.hero:after{content:"";position:absolute;width:190px;height:190px;border-radius:50%;right:-70px;top:-90px;
 background:rgba(255,255,255,.09);box-shadow:-90px 120px 0 rgba(255,255,255,.045)}
.hero h1,.hero .quote,.hero small{position:relative;z-index:1}
.card{box-shadow:var(--shadow2);transition:transform .18s,box-shadow .18s,border-color .18s}
.card:hover{transform:translateY(-2px);box-shadow:0 20px 50px rgba(15,23,42,.13)}
.stat{position:relative;overflow:hidden}
.stat:after{content:"";position:absolute;width:70px;height:70px;border-radius:50%;left:-25px;bottom:-25px;
 background:color-mix(in srgb,var(--accent) 9%,transparent)}
.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 18px rgba(91,92,240,.18)}
.secondary{border:1px solid var(--line);transition:.18s}
.secondary:hover{border-color:color-mix(in srgb,var(--accent) 35%,var(--line));background:color-mix(in srgb,var(--accent) 6%,var(--card))}
.drawer .panel{box-shadow:-20px 0 55px rgba(0,0,0,.18);animation:drawerIn .22s ease}
.nav button{transition:.15s}
.nav button:hover{background:color-mix(in srgb,var(--accent) 8%,var(--card));color:var(--accent);transform:translateX(-3px)}
.badge{background:color-mix(in srgb,var(--accent) 12%,var(--card));color:var(--accent)}
.modal{backdrop-filter:blur(4px)}
.dialog{box-shadow:0 25px 80px rgba(0,0,0,.22);animation:pop .18s ease}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);
 box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
.toast{box-shadow:0 12px 35px rgba(0,0,0,.22);animation:toastIn .2s ease}
.homeMinimal{min-height:calc(100vh - 70px);display:grid;place-items:center;position:relative;overflow:hidden;padding:30px 18px}.homeContent{text-align:center;position:relative;z-index:1;max-width:620px}.homeIcon{width:92px;height:92px;border-radius:26px;box-shadow:0 18px 45px rgba(49,46,129,.22);margin-bottom:20px}.homeKicker{font-size:14px;color:var(--muted);font-weight:700;margin-bottom:10px}.homeQuote{font-size:clamp(21px,5vw,30px);font-weight:800;line-height:1.9;letter-spacing:-.4px}.homeHint{margin-top:22px;color:var(--muted);font-size:13px}.homeGlow{position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(91,92,240,.13),transparent 68%);filter:blur(2px)}

@keyframes drawerIn{from{transform:translateX(25px);opacity:.5}to{transform:none;opacity:1}}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}to{transform:none;opacity:1}}
@keyframes toastIn{from{transform:translate(-50%,10px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
</style>

<style>
@media print{
 @page{size:A4;margin:0}
 body>*:not(#modal){display:none!important}
 #modal{display:block!important;position:static!important;background:#fff!important;padding:0!important}
 #modal .dialog{display:block!important;width:210mm!important;min-height:297mm!important;max-height:none!important;
   margin:0!important;border-radius:0!important;box-shadow:none!important;padding:0!important;background:#fff!important;color:#111!important}
 #modal .dialog>#invoicePaper{display:block!important}
 #modal .dialog>.formActions{display:none!important}
 #invoicePaper{min-height:297mm!important;padding:16mm 15mm!important;direction:rtl!important;background:#fff!important;color:#111!important}
 #invoicePaper *{color:#111!important}
 .invoiceTop{display:flex!important;justify-content:space-between!important;align-items:flex-start!important}
 .invoiceTable{width:100%!important;border-collapse:collapse!important}
 .invoiceTable th{background:#f1f5f9!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .invoiceTable th,.invoiceTable td{padding:9px!important;border:1px solid #dbe1e8!important}
}
.invoicePaper{background:#fff;color:#111;border-radius:18px;overflow:hidden;box-shadow:0 12px 45px #00000014;direction:rtl}
.invoiceHead{padding:26px;background:linear-gradient(135deg,#111827,#4338ca);color:#fff}
.invoiceHead *{color:#fff}
.invoiceTop{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}
.invoiceLogo{display:flex;gap:12px;align-items:center}
.invoiceLogoMark{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:#ffffff1c;font-size:24px;font-weight:900}
.invoiceTitle{font-size:28px;font-weight:900;margin:0 0 4px}
.invoiceMeta{background:#ffffff14;border:1px solid #ffffff22;border-radius:14px;padding:11px 14px;min-width:150px}
.invoiceBody{padding:24px}
.invoiceInfo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px}
.infoBox{border:1px solid #e5e7eb;border-radius:14px;padding:14px}
.infoBox small{display:block;color:#64748b;margin-bottom:5px}
.invoiceTable{width:100%;border-collapse:separate;border-spacing:0;overflow:hidden;border:1px solid #e5e7eb;border-radius:14px}
.invoiceTable th{background:#f1f5f9;padding:11px;text-align:right}
.invoiceTable td{padding:11px;border-top:1px solid #e5e7eb}
.invoiceTable th:not(:last-child),.invoiceTable td:not(:last-child){border-left:1px solid #e5e7eb}
.invoiceTotals{margin-top:18px;display:flex;justify-content:flex-start}
.totalBox{width:min(330px,100%);border:1px solid #e5e7eb;border-radius:16px;padding:15px}
.totalRow{display:flex;justify-content:space-between;padding:7px 0;color:#475569}
.totalFinal{margin-top:7px;padding-top:12px;border-top:2px solid #111827;display:flex;justify-content:space-between;font-size:18px;font-weight:900}
.invoiceFooter{margin-top:35px;padding-top:15px;border-top:1px dashed #cbd5e1;color:#64748b;font-size:12px;display:flex;justify-content:space-between;gap:15px}
.invoiceItem input{direction:rtl}
</style>

<body>
<div class="app">
<header class="top"><div class="brand"><img class="brandLogo" src="app-icon.svg" alt="Decorative Pro"><span>Decorative Pro</span></div><button class="menuBtn" onclick="openDrawer()">☰</button></header>
<main id="view"></main>
</div>

<div class="drawer" id="drawer" onclick="if(event.target===this||event.target.classList.contains('shade'))closeDrawer()">
<div class="shade"></div><aside class="panel">
<div class="row"><h2 style="margin:0">منوی برنامه</h2><button class="secondary" onclick="closeDrawer()">✕</button></div>
<div class="nav">
<button onclick="show('home')">🏠 داشبورد</button>
<button onclick="show('customers')">👥 مشتریان</button>
<button onclick="show('projects')">🏗️ پروژه‌ها</button>
<button onclick="show('receipts')">💰 دریافتی‌ها</button>
<button onclick="show('invoices')">🧾 فاکتورها</button>
<button onclick="show('accounts')">🏦 حساب‌ها و کارت‌ها</button>
<button onclick="show('reports')">📊 گزارش‌ها</button>
<button onclick="show('backup')">💾 پشتیبان‌گیری</button>
<button onclick="show('settings')">⚙️ تنظیمات</button>
</div></aside></div>

<div class="modal" id="modal"><div class="dialog" id="dialog"></div></div>
<div class="toast" id="toast"></div>

<script>
const KEY='decorative_pro_v1';
const DEFAULT_DB={customers:[],projects:[],receipts:[],invoices:[],accounts:[],settings:{business:'Decorative',theme:'light',accent:'#5b5cf0'}};
let db=(()=>{try{const raw=window.electronStore?.load?.(); if(raw){return JSON.parse(raw)} const legacy=localStorage.getItem(KEY); if(legacy){window.electronStore?.save?.(legacy); return JSON.parse(legacy)} return DEFAULT_DB}catch(e){return DEFAULT_DB}})();
const quotes=['هر دریافتی کوچک، یک قدم به هدف بزرگ‌تر است.','نظم مالی یعنی آرامش بیشتر در کسب‌وکار.','امروز ثبت کن، فردا دقیق‌تر تصمیم بگیر.','پول را مدیریت کن تا پول تو را مدیریت نکند.','رشد واقعی از تصمیم‌های کوچک و منظم شروع می‌شود.'];
function save(){const raw=JSON.stringify(db); if(window.electronStore?.save) window.electronStore.save(raw); else localStorage.setItem(KEY,raw);}
function money(n){return new Intl.NumberFormat('fa-IR').format(Number(n)||0)+' تومان'}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
function openDrawer(){document.getElementById('drawer').classList.add('open')}
function closeDrawer(){document.getElementById('drawer').classList.remove('open')}
function modal(content){document.getElementById('dialog').innerHTML=content;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function show(page){
 closeDrawer(); let v=document.getElementById('view');
 if(page==='home')return home();
 if(page==='customers')return customers();
 if(page==='projects')return projects();
 if(page==='receipts')return receipts();
 if(page==='invoices')return invoices();
 if(page==='accounts')return accounts();
 if(page==='reports')return reports();
 if(page==='backup')return backup();
 if(page==='settings')return settings();
}
function home(){
 let total=db.receipts.reduce((a,x)=>a+Number(x.amount||0),0), active=db.projects.filter(x=>x.status!=='تکمیل‌شده').length;
 let contracts=db.projects.reduce((a,x)=>a+Number(x.amount||0),0), remaining=Math.max(contracts-total,0);
 document.getElementById('view').innerHTML=`<section class="hero"><small>مدیریت هوشمند کسب‌وکار</small><h1 style="margin:8px 0">سلام 👋</h1><div class="quote">«${quotes[new Date().getDate()%quotes.length]}»</div></section>
 <div class="grid"><div class="card stat">👥 مشتریان<b>${db.customers.length.toLocaleString('fa-IR')}</b><span class="muted">پرونده ثبت‌شده</span></div>
 <div class="card stat">🏗️ پروژه‌ها<b>${active.toLocaleString('fa-IR')}</b><span class="muted">پروژه فعال</span></div>
 <div class="card stat">💰 دریافتی<b>${money(total)}</b><span class="muted">مجموع ثبت‌شده</span></div>
 <div class="card stat">📌 مانده قراردادها<b>${money(remaining)}</b><span class="muted">مبلغ قابل دریافت</span></div>
 <div class="card stat">🧾 فاکتورها<b>${db.invoices.length.toLocaleString('fa-IR')}</b><span class="muted">فاکتور ثبت‌شده</span></div></div>
 <div class="sectionTitle"><h3>دسترسی سریع</h3></div><div class="actions">
 <button class="primary" onclick="newCustomer()">+ مشتری جدید</button><button class="secondary" onclick="newProject()">+ پروژه جدید</button><button class="secondary" onclick="newReceipt()">+ دریافتی جدید</button><button class="secondary" onclick="newInvoice()">+ فاکتور جدید</button></div>`;
}
function customers(){
 let items=db.customers.map((c,i)=>{
 let contract=db.projects.filter(x=>x.customer===c.name).reduce((a,x)=>a+Number(x.amount||0),0);
 let received=db.receipts.filter(x=>x.customer===c.name).reduce((a,x)=>a+Number(x.amount||0),0);
 let remain=Math.max(contract-received,0);
 let status=contract===0?'بدون قرارداد':remain===0?'تسویه شده':'بدهکار';
 return `<div class="card"><div class="row"><div><b>${esc(c.name)}</b><div class="muted">${esc(c.phone||'بدون شماره')}</div></div><span class="badge">${status}</span></div>
 <div class="grid" style="margin-top:12px"><div><span class="muted">قرارداد</span><br><b>${money(contract)}</b></div><div><span class="muted">دریافتی</span><br><b>${money(received)}</b></div><div><span class="muted">مانده</span><br><b>${money(remain)}</b></div></div>
 <div class="actions" style="margin-top:12px">
<button class="secondary" onclick="customerFinance(${i})">پرونده مالی</button>
${c.phone?`<a class="secondary" style="text-decoration:none" href="tel:${esc(c.phone)}">📞 تماس</a>`:''}
${c.phone?`<a class="secondary" style="text-decoration:none" target="_blank" href="https://wa.me/${String(c.phone).replace(/[^0-9+]/g,'').replace(/^0/,'98')}">💬 واتساپ</a>`:''}
${c.address?`<a class="secondary" style="text-decoration:none" target="_blank" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(c.address)}">📍 مسیریابی</a>`:''}
<button class="secondary" onclick="editCustomer(${i})">ویرایش</button><button class="danger" onclick="del('customers',${i},'مشتری')">حذف</button></div></div>`}).join('');
 document.getElementById('view').innerHTML=`<div class="sectionTitle"><h2>👥 مشتریان</h2><button class="primary" onclick="newCustomer()">+ مشتری</button></div>
<div class="card" style="margin-bottom:12px">
<div class="field"><label>جستجوی مشتری</label><input id="customerSearch" placeholder="نام یا شماره تماس..." oninput="filterCustomers()"></div>
<div class="actions" style="margin-top:10px">
<button class="secondary" onclick="setCustomerFilter('all')">همه</button>
<button class="secondary" onclick="setCustomerFilter('debt')">بدهکار</button>
<button class="secondary" onclick="setCustomerFilter('settled')">تسویه‌شده</button>
</div></div>
<div id="customerList" class="list">${items||'<div class="empty">هنوز مشتری ثبت نشده است.</div>'}</div>`;
}
let customerFilter='all';
function setCustomerFilter(v){customerFilter=v;filterCustomers()}
function filterCustomers(){
 const q=(document.getElementById('customerSearch')?.value||'').trim().toLowerCase();
 const list=document.getElementById('customerList'); if(!list)return;
 const cards=[...list.children];
 db.customers.forEach((c,i)=>{
   let contract=db.projects.filter(x=>x.customer===c.name).reduce((a,x)=>a+Number(x.amount||0),0);
   let received=db.receipts.filter(x=>x.customer===c.name).reduce((a,x)=>a+Number(x.amount||0),0);
   let status=contract>0 && contract===received?'settled':contract>received?'debt':'all';
   const hay=(c.name+' '+(c.phone||'')).toLowerCase();
   const okQ=!q||hay.includes(q);
   const okF=customerFilter==='all'||status===customerFilter;
   if(cards[i]) cards[i].style.display=(okQ&&okF)?'':'none';
 });
}
function newCustomer(i=null){
 let c=i==null?{name:'',phone:'',address:'',notes:''}:db.customers[i];
 modal(`<h2>${i==null?'مشتری جدید':'ویرایش مشتری'}</h2><form class="form" onsubmit="saveCustomer(event,${i})">
 <div class="field"><label>نام مشتری *</label><input id="f_name" required value="${esc(c.name)}"></div><div class="field"><label>شماره تماس</label><input id="f_phone" inputmode="tel" value="${esc(c.phone)}"></div><div class="field"><label>آدرس</label><textarea id="f_address">${esc(c.address)}</textarea></div><div class="field"><label>توضیحات</label><textarea id="f_notes">${esc(c.notes)}</textarea></div>
 <div class="formActions"><button class="primary">ذخیره</button><button type="button" class="secondary" onclick="closeModal()">انصراف</button></div></form>`);
}
function customerFinance(i){
 let c=db.customers[i];
 let projects=db.projects.filter(x=>x.customer===c.name);
 let receipts=db.receipts.filter(x=>x.customer===c.name);
 let contract=projects.reduce((a,x)=>a+Number(x.amount||0),0);
 let received=receipts.reduce((a,x)=>a+Number(x.amount||0),0);
 let remain=Math.max(contract-received,0);
 modal(`<h2>پرونده مالی — ${esc(c.name)}</h2>
 <div class="grid"><div class="card"><span class="muted">مبلغ قرارداد</span><b>${money(contract)}</b></div>
 <div class="card"><span class="muted">مجموع دریافتی</span><b>${money(received)}</b></div>
 <div class="card"><span class="muted">مانده</span><b>${money(remain)}</b></div></div>

function saveInvoice(e,i){
 e.preventDefault();
 let items=[...document.querySelectorAll('.invoiceItem')].map(r=>({desc:r.querySelector('.itDesc').value.trim(),qty:num(r.querySelector('.itQty').value),price:num(r.querySelector('.itPrice').value)})).filter(x=>x.desc&&x.qty>0&&x.price>=0);
 if(!items.length){toast('حداقل یک قلم معتبر وارد کنید');return}
 let subtotal=items.reduce((a,x)=>a+x.qty*x.price,0);

 if(discount>subtotal)discount=subtotal;
 let data={customer:i_customer.value.trim(),number:i_number.value.trim()||'INV-'+Date.now().toString().slice(-6),items,subtotal,discount,total:subtotal-discount,card:i_card.value.trim(),date:(i==null?new Date().toLocaleDateString('fa-IR'):(db.invoices[i].date||new Date().toLocaleDateString('fa-IR')))};

function persianMoney(n){return new Intl.NumberFormat('fa-IR').format(num(n))+' تومان'}
function formatAmountValue(v){let n=String(v??'').replace(/[^0-9۰-۹]/g,''); n=n.replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)); if(!n)return ''; return new Intl.NumberFormat('en-US').format(Number(n))}
function attachMoneyInputs(root=document){root.querySelectorAll('input.moneyInput,input[data-money]').forEach(el=>{el.value=formatAmountValue(el.value);el.addEventListener('input',()=>{let pos=el.selectionStart;let before=el.value.slice(0,pos).replace(/[^0-9۰-۹]/g,'').length;el.value=formatAmountValue(el.value);let digits=el.value.replace(/[^0-9]/g,'');let target=el.value.length;let count=0;for(let i=0;i<el.value.length;i++){if(/[0-9]/.test(el.value[i]))count++;if(count>=before){target=i+1;break}}try{el.setSelectionRange(target,target)}catch{}})})}
function isoToFa(v){if(!v)return '-';let d=new Date(v+'T00:00:00');return new Intl.DateTimeFormat('fa-IR',{year:'numeric',month:'2-digit',day:'2-digit'}).format(d)}
function amountToWords(n){n=num(n); if(!n)return 'صفر تومان'; const u=['','یک','دو','سه','چهار','پنج','شش','هفت','هشت','نه','ده','یازده','دوازده','سیزده','چهارده','پانزده','شانزده','هفده','هجده','نوزده']; const tens=['','','بیست','سی','چهل','پنجاه','شصت','هفتاد','هشتاد','نود']; const hund=['','صد','دویست','سیصد','چهارصد','پانصد','ششصد','هفتصد','هشتصد','نهصد']; const scales=['','هزار','میلیون','میلیارد','تریلیون']; function chunk(x){let a=[];if(x>=100){a.push(hund[Math.floor(x/100)]);x%=100;if(x)a.push('و')}if(x>=20){a.push(tens[Math.floor(x/10)]);x%=10;if(x)a.push('و')}if(x>0&&x<20)a.push(u[x]);return a.join(' ')}let parts=[];let i=0;while(n>0){let c=n%1000;if(c){let t=chunk(c);if(scales[i])t+=' '+scales[i];parts.unshift(t)}n=Math.floor(n/1000);i++}return parts.join(' و ')+' تومان'}
function addMoneyMask(id){let el=document.getElementById(id);if(el){el.classList.add('moneyInput');el.dataset.money='1';attachMoneyInputs(el.parentElement||document)}}

function serviceEditor(items=[]){let arr=items.length?items:[{desc:'',amount:0}];return `<div id="serviceRows" class="serviceRows">${arr.map((it,i)=>`<div class="serviceRow serviceItem"><div class="field"><label>شرح خدمت انجام‌شده</label><input class="svcDesc" value="${esc(it.desc||'')}" placeholder="مثلاً نصب آشپزخانه"></div><div class="field"><label>مبلغ</label><input class="svcAmount moneyInput" data-money inputmode="numeric" value="${formatAmountValue(it.amount||0)}"></div><button type="button" class="danger" onclick="this.closest('.serviceRow').remove()">✕</button></div>`).join('')}</div><button type="button" class="secondary" style="margin-top:10px" onclick="addServiceRow()">+ افزودن خدمت</button>`}
function addServiceRow(){let box=document.getElementById('serviceRows');if(!box)return;let d=document.createElement('div');d.className='serviceRow serviceItem';d.innerHTML=`<div class="field"><label>شرح خدمت انجام‌شده</label><input class="svcDesc" placeholder="مثلاً نصب کمد"></div><div class="field"><label>مبلغ</label><input class="svcAmount moneyInput" data-money inputmode="numeric"></div><button type="button" class="danger" onclick="this.closest('.serviceRow').remove()">✕</button>`;box.appendChild(d);attachMoneyInputs(d)}
function collectServices(){return [...document.querySelectorAll('.serviceItem')].map(r=>({desc:r.querySelector('.svcDesc')?.value.trim()||'',amount:num(r.querySelector('.svcAmount')?.value)})).filter(x=>x.desc&&x.amount>=0)}

function invoices(){let items=db.invoices.map((x,i)=>`<div class="card invoiceCard" data-search="${esc((x.customer||'')+' '+(x.number||'')+' '+(x.items||[]).map(y=>y.desc).join(' '))}"><div class="row"><div><b>${esc(x.customer||'بدون مشتری')}</b><div class="muted">${esc(x.number||'-')} · ${esc(x.date||'-')}</div></div><b>${money(x.total)}</b></div><div class="muted" style="margin-top:8px">${(x.items||[]).map(y=>esc(y.desc)).join(' · ')}</div><div class="actions" style="margin-top:10px"><button class="primary" onclick="previewInvoice(${i})">👁️ مشاهده / PDF</button><button class="secondary" onclick="editInvoice(${i})">ویرایش</button><button class="danger" onclick="del('invoices',${i},'فاکتور')">حذف</button></div></div>`).join('');document.getElementById('view').innerHTML=`<div class="sectionTitle"><h2>🔨 فاکتور خدمات نصب و اجرا</h2><button class="primary" onclick="newInvoice()">+ فاکتور خدمات</button></div><div class="card" style="margin-bottom:12px"><div class="field"><label>جستجوی فاکتور</label><input id="invoiceSearch" placeholder="مشتری، شماره فاکتور یا خدمت..." oninput="filterInvoices()"></div></div><div class="list">${items||'<div class="empty">هنوز فاکتور خدماتی ثبت نشده است.</div>'}</div>`}
function newInvoice(existingIndex=null, customerName=''){let x=existingIndex==null?{customer:customerName,number:'INS-'+Date.now().toString().slice(-6),items:[{desc:'',amount:0}],card:'',notes:''}:db.invoices[existingIndex];modal(`<h2>${existingIndex==null?'🔨 فاکتور خدمات نصب و اجرا':'✏️ ویرایش فاکتور خدمات'}</h2><form class="form" onsubmit="saveInvoice(event,${existingIndex})"><div class="field"><label>مشتری *</label><input id="i_customer" required value="${esc(x.customer||'')}"></div><div class="grid"><div class="field"><label>شماره فاکتور</label><input id="i_number" value="${esc(x.number||'')}"></div><div class="field"><label>تاریخ</label><input id="i_date" type="date" value="${x.isoDate||new Date().toISOString().slice(0,10)}"></div></div><div class="field"><label>🔨 خدمات انجام‌شده</label>${serviceEditor(x.items||[])}</div><div class="field"><label>شماره کارت / حساب</label><input id="i_card" value="${esc(x.card||'')}"></div><div class="field"><label>توضیحات</label><textarea id="i_notes">${esc(x.notes||'')}</textarea></div><div class="formActions"><button class="primary">ذخیره فاکتور</button><button type="button" class="secondary" onclick="closeModal()">انصراف</button></div></form>`);attachMoneyInputs(document.getElementById('dialog'))}

function preinvoices(){let items=db.preInvoices.map((x,i)=>`<div class="card"><div class="row"><div><b>${esc(x.customer||'-')}</b><div class="muted">${esc(x.number||'-')} · ${esc(x.date||'-')}</div></div><b>${money(x.total)}</b></div><div class="muted" style="margin-top:8px">${(x.items||[]).map(y=>esc(y.desc)).join(' · ')}</div><div class="actions" style="margin-top:10px"><button class="primary" onclick="previewPreInvoice(${i})">👁️ مشاهده / PDF</button><button class="secondary" onclick="editPreInvoice(${i})">ویرایش</button><button class="danger" onclick="del('preInvoices',${i},'پیش‌فاکتور')">حذف</button></div></div>`).join('');document.getElementById('view').innerHTML=`<div class="sectionTitle"><h2>📋 پیش‌فاکتور خدمات</h2><button class="primary" onclick="newPreInvoice()">+ پیش‌فاکتور</button></div><div class="list">${items||'<div class="empty">هنوز پیش‌فاکتوری ثبت نشده است.</div>'}</div>`}
function newPreInvoice(i=null){let x=i==null?{customer:'',number:'PRE-'+Date.now().toString().slice(-6),items:[{desc:'',amount:0}],card:'',notes:''}:db.preInvoices[i];modal(`<h2>${i==null?'📋 پیش‌فاکتور خدمات':'✏️ ویرایش پیش‌فاکتور'}</h2><form class="form" onsubmit="savePreInvoice(event,${i})"><div class="field"><label>مشتری *</label><input id="pfi_customer" required value="${esc(x.customer||'')}"></div><div class="grid"><div class="field"><label>شماره پیش‌فاکتور</label><input id="pfi_number" value="${esc(x.number||'')}"></div><div class="field"><label>تاریخ</label><input id="pfi_date" type="date" value="${x.isoDate||new Date().toISOString().slice(0,10)}"></div></div><div class="field"><label>🔨 خدمات پیشنهادی</label>${serviceEditor(x.items||[])}</div><div class="field"><label>شماره کارت / حساب</label><input id="pfi_card" value="${esc(x.card||'')}"></div><div class="field"><label>توضیحات</label><textarea id="pfi_notes">${esc(x.notes||'')}</textarea></div><div class="formActions"><button class="primary">ذخیره</button><button type="button" class="secondary" onclick="closeModal()">انصراف</button></div></form>`);attachMoneyInputs(document.getElementById('dialog'))}

n class="primary">ذخیره قرارداد</button><button type="button" class="secondary" onclick="closeModal()">انصراف</button></div></form>`);document.getElementById('c_type').value=x.type||'کابینت / پروژه بزرگ';attachMoneyInputs(document.getElementById('dialog'))}

function newProject(i=null){
 const p=i==null?{name:'',customer:'',amount:0,status:'فعال',start:'',delivery:'',notes:'',photos:[]}:(db.projects[i]||{});
 modal(`<h2>${i==null?'پروژه جدید':'ویرایش پروژه'}</h2><form class="form" onsubmit="v8SaveProject(event,${i})"><div class="field"><label>نام پروژه *</label><input id="v8_p_name" required value="${v8Text(p.name)}"></div><div class="field"><label>مشتری</label><input id="v8_p_customer" value="${v8Text(p.customer)}"></div><div class="field"><label>مبلغ پروژه</label><input id="v8_p_amount" class="moneyInput" data-money inputmode="numeric" value="${formatAmountValue(p.amount||0)}"></div><div class="grid"><div class="field"><label>وضعیت</label><select id="v8_p_status"><option>فعال</option><option>در انتظار</option><option>در حال اجرا</option><option>تکمیل‌شده</option><option>لغوشده</option></select></div><div class="field"><label>تاریخ شروع</label><input id="v8_p_start" type="date" value="${v8Text(p.start||'')}"></div></div><div class="field"><label>تاریخ تحویل</label><input id="v8_p_delivery" type="date" value="${v8Text(p.delivery||'')}"></div><div class="field"><label>عکس‌های پروژه</label><input id="v8_p_photos" type="file" accept="image/*" multiple><div class="muted">حداکثر ۸ عکس؛ تصاویر روی همین دستگاه ذخیره می‌شوند.</div>${p.photos?.length?`<div class="thumbGrid">${p.photos.slice(0,8).map(src=>`<img src="${src}" alt="">`).join('')}</div>`:''}</div><div class="field"><label>توضیحات</label><textarea id="v8_p_notes">${v8Text(p.notes||'')}</textarea></div><div class="formActions"><button class="primary">ذخیره پروژه</button><button type="button" class="secondary" onclick="closeModal()">انصراف</button></div></form>`);
 const st=document.getElementById('v8_p_status');if(st)st.value=p.status||'فعال';attachMoneyInputs(document.getElementById('dialog'));
}
function editProject(i){newProject(i)}
function v8ResizeImage(file,max=1200,quality=.78){return new Promise(resolve=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{let w=im.width,h=im.height;if(w>max||h>max){const s=Math.min(max/w,max/h);w=Math.round(w*s);h=Math.round(h*s)}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);resolve(c.toDataURL('image/jpeg',quality))};im.src=r.result};r.readAsDataURL(file)})}
async function v8SaveProject(e,i){e.preventDefault();let photos=i==null?[]:(db.projects[i]?.photos||[]);const files=[...(document.getElementById('v8_p_photos')?.files||[])];for(const f of files.slice(0,8))photos.push(await v8ResizeImage(f));const x={name:document.getElementById('v8_p_name').value.trim(),customer:document.getElementById('v8_p_customer').value.trim(),amount:v8Num(document.getElementById('v8_p_amount').value),status:document.getElementById('v8_p_status').value,start:document.getElementById('v8_p_start').value,delivery:document.getElementById('v8_p_delivery').value,notes:document.getElementById('v8_p_notes').value.trim(),photos};if(i==null||i<0)db.projects.push(x);else db.projects[i]=x;save();closeModal();projects();toast('پروژه ذخیره شد')}

function v8GlobalSearch(){modal(`<div><div class="row"><h2>🔎 جستجوی سراسری</h2><button class="secondary" onclick="closeModal()">✕</button></div><input id="v8GlobalQ" autofocus placeholder="مشتری، پروژه، فاکتور، قرارداد، دریافتی..." oninput="v8RunSearch(this.value)"><div id="v8GlobalResults" class="globalSearchResults" style="margin-top:12px"><div class="empty">برای جستجو چیزی بنویسید.</div></div></div>`);document.getElementById('v8GlobalQ')?.focus()}
function v8RunSearch(q){q=(q||'').trim().toLowerCase();const out=[];if(!q){document.getElementById('v8GlobalResults').innerHTML='<div class="empty">برای جستجو چیزی بنویسید.</div>';return}db.customers.forEach((x,i)=>{if(JSON.stringify(x).toLowerCase().includes(q))out.push(`<div class="card resultCard" onclick="closeModal();customerFinance(${i})"><b>👤 ${v8Text(x.name)}</b><div class="muted">مشتری</div></div>`)});db.projects.forEach((x,i)=>{if(JSON.stringify(x).toLowerCase().includes(q))out.push(`<div class="card resultCard" onclick="closeModal();v8ProjectDetails(${i})"><b>🏗️ ${v8Text(x.name)}</b><div class="muted">${v8Text(x.customer||'')}</div></div>`)});[['invoices','🔨 فاکتور'],['preInvoices','📋 پیش‌فاکتور'],['contracts','📑 قرارداد'],['receipts','💰 دریافتی']].forEach(([k,label])=>(db[k]||[]).forEach(x=>{if(JSON.stringify(x).toLowerCase().includes(q))out.push(`<div class="card"><b>${label} ${v8Text(x.number||'-')}</b><div class="muted">${v8Text(x.customer||'')} · ${money(x.total??x.amount)}</div></div>`)}));document.getElementById('v8GlobalResults').innerHTML=out.join('')||'<div class="empty">موردی پیدا نشد.</div>'}

function v8Alerts(){const now=new Date();const limit=new Date(now.getTime()+7*86400000);const out=[];db.projects.forEach(p=>{if(!p.delivery||p.status==='تکمیل‌شده')return;const d=new Date(p.delivery+'T00:00:00');if(d<now)out.push(`<div class="card alertCard alertDanger"><b>⏰ تحویل گذشته: ${v8Text(p.name)}</b><div class="muted">${v8Date(p.delivery)}</div></div>`);else if(d<=limit)out.push(`<div class="card alertCard alertWarn"><b>🔔 تحویل نزدیک: ${v8Text(p.name)}</b><div class="muted">${v8Date(p.delivery)}</div></div>`)});db.contracts.forEach(c=>{if(!c.delivery)return;const d=new Date(c.delivery+'T00:00:00');if(d<=limit)out.push(`<div class="card alertCard ${d<now?'alertDanger':'alertWarn'}"><b>📑 ${d<now?'سررسید گذشته':'سررسید نزدیک'} قرارداد ${v8Text(c.number||'-')}</b><div class="muted">${v8Text(c.customer||'')} · ${v8Date(c.delivery)}</div></div>`)});db.customers.forEach(c=>{const due=db.projects.filter(p=>p.customer===c.name).reduce((a,p)=>a+v8Num(p.amount),0)+db.contracts.filter(x=>x.customer===c.name).reduce((a,x)=>a+v8Num(x.amount),0)-db.receipts.filter(x=>x.customer===c.name).reduce((a,x)=>a+v8Num(x.amount),0);if(due>0)out.push(`<div class="card alertCard"><b>💰 مانده قابل دریافت از ${v8Text(c.name)}</b><div class="muted">${money(due)}</div></div>`)});document.getElementById('view').innerHTML=`<div class="sectionTitle"><h2>🔔 هشدارها و سررسیدها</h2></div><div class="list">${out.join('')||'<div class="empty">فعلاً هشداری وجود ندارد.</div>'}</div>`}

function v8Calendar(){const events=[];db.projects.forEach(p=>{if(p.delivery)events.push({date:p.delivery,title:'تحویل پروژه',name:p.name})});db.contracts.forEach(c=>{if(c.delivery)events.push({date:c.delivery,title:'سررسید قرارداد',name:c.customer||c.number})});db.receipts.forEach(r=>{if(r.isoDate)events.push({date:r.isoDate,title:'دریافت وجه',name:r.customer||''})});events.sort((a,b)=>a.date.localeCompare(b.date));document.getElementById('view').innerHTML=`<div class="sectionTitle"><h2>📅 تقویم و تاریخ‌های مهم</h2></div><div class="card" style="margin-bottom:12px"><b>امروز: ${new Intl.DateTimeFormat('fa-IR',{dateStyle:'full'}).format(new Date())}</b><div class="muted" style="margin-top:6px">موعدهای پروژه، قرارداد و دریافت‌ها.</div></div><div class="list">${events.map(e=>`<div class="calendarDay"><b>${v8Date(e.date)} — ${v8Text(e.title)}</b><span>${v8Text(e.name)}</span></div>`).join('')||'<div class="empty">تاریخ مهمی ثبت نشده است.</div>'}</div>`}

function reports(){const rec=db.receipts.reduce((a,x)=>a+v8Num(x.amount),0),inv=db.invoices.reduce((a,x)=>a+v8Num(x.total),0),pre=db.preInvoices.reduce((a,x)=>a+v8Num(x.total),0),con=db.contracts.reduce((a,x)=>a+v8Num(x.amount),0);const months={};db.receipts.forEach(r=>{if(r.isoDate){const k=r.isoDate.slice(0,7);months[k]=(months[k]||0)+v8Num(r.amount)}});const vals=Object.values(months),mx=Math.max(...vals,1);const bars=Object.entries(months).sort().slice(-12).map(([k,v])=>`<div class="barRowV8"><span>${v8Date(k+'-01').slice(0,7)}</span><div class="barV8" style="width:${Math.max(3,v/mx*100)}%"></div><b>${money(v)}</b></div>`).join('');document.getElementById('view').innerHTML=`<div class="sectionTitle"><h2>📊 گزارش مدیریتی</h2></div><div class="grid"><div class="card stat">مجموع دریافتی<b>${money(rec)}</b></div><div class="card stat">فاکتور خدمات<b>${money(inv)}</b></div><div class="card stat">پیش‌فاکتورها<b>${money(pre)}</b></div><div class="card stat">قراردادها<b>${money(con)}</b></div></div><div class="card" style="margin-top:12px"><h3 style="margin-top:0">روند دریافتی ماهانه</h3><div class="barChartV8">${bars||'<div class="empty">دریافتی‌ای برای نمودار ثبت نشده است.</div>'}</div></div><div class="card" style="margin-top:12px"><h3 style="margin-top:0">مانده مشتریان</h3><div class="list">${db.customers.map(c=>{const due=db.projects.filter(p=>p.customer===c.name).reduce((a,p)=>a+v8Num(p.amount),0)+db.contracts.filter(x=>x.customer===c.name).reduce((a,x)=>a+v8Num(x.amount),0)-db.receipts.filter(x=>x.customer===c.name).reduce((a,x)=>a+v8Num(x.amount),0);return `<div class="row"><span>${v8Text(c.name)}</span><b>${money(Math.max(due,0))}</b></div>`}).join('')||'<div class="empty">مشتری‌ای ثبت نشده است.</div>'}</div></div>`}

function settings(){document.getElementById('view').innerHTML=`<div class="sectionTitle"><h2>⚙️ تنظیمات و امنیت</h2></div><div class="card"><div class="field"><label>نام برنامه</label><input id="v8_appName" value="${v8Text(db.settings.appName||'Decorative Pro')}"></div><div class="field"><label>نام کسب‌وکار</label><input id="v8_business" value="${v8Text(db.settings.business||'Decorative')}"></div><div class="grid"><div class="field"><label>تم</label><select id="v8_theme"><option value="light">روشن</option><option value="dark">تاریک</option></select></div><div class="field"><label>رنگ اصلی</label><select id="v8_accent"><option value="#5b5cf0">بنفش</option><option value="#2563eb">آبی</option><option value="#059669">سبز</option><option value="#dc2626">قرمز</option><option value="#d97706">نارنجی</option></select></div></div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><h3>🔐 امنیت</h3><label style="display:flex;gap:8px;align-items:center"><input id="v8_pinEnabled" type="checkbox" ${db.settings.pinEnabled?'checked':''} style="width:auto"> فعال‌سازی قفل PIN</label><div class="field" style="margin-top:10px"><label>PIN جدید</label><input id="v8_pin" type="password" inputmode="numeric" maxlength="8" placeholder="۴ تا ۸ رقم"></div><div class="muted">PIN فقط روی همین دستگاه ذخیره می‌شود.</div><div class="actions" style="margin-top:14px"><button class="primary" onclick="v8SaveSettings()">ذخیره تنظیمات</button><button class="secondary" onclick="v8LockNow()">🔒 قفل برنامه</button></div></div>`;document.getElementById('v8_theme').value=db.settings.theme||'light';document.getElementById('v8_accent').value=db.settings.accent||'#5b5cf0'}
function v8SaveSettings(){const pin=document.getElementById('v8_pin').value.trim();if(pin&&!/^\d{4,8}$/.test(pin)){toast('PIN باید ۴ تا ۸ رقم باشد');return}db.settings.appName=(document.getElementById('v8_appName').value||'Decorative Pro').trim();db.settings.business=(document.getElementById('v8_business').value||'Decorative').trim();db.settings.theme=document.getElementById('v8_theme').value;db.settings.accent=document.getElementById('v8_accent').value;db.settings.pinEnabled=document.getElementById('v8_pinEnabled').checked;if(pin)db.settings.pin=pin;save();applyTheme();document.title=db.settings.appName;const brand=document.querySelector('.brand span');if(brand)brand.textContent=db.settings.appName;toast('تنظیمات ذخیره شد')}
function v8EnsurePinUI(){if(document.getElementById('v8PinOverlay'))return;const d=document.createElement('div');d.id='v8PinOverlay';d.className='pinOverlayV8';d.innerHTML=`<div class="pinBoxV8"><img src="app-icon.svg" width="68" height="68" alt=""><h2>قفل برنامه</h2><p>برای ورود، PIN را وارد کنید.</p><input id="v8PinInput" type="password" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="••••"><div class="formActions" style="justify-content:center;margin-top:15px"><button class="primary" onclick="v8Unlock()">ورود</button></div><div id="v8PinError" style="margin-top:10px;color:#dc2626"></div></div>`;document.body.appendChild(d)}
function v8LockNow(){if(!db.settings.pinEnabled||!db.settings.pin){toast('ابتدا PIN را فعال کنید');return}v8EnsurePinUI();document.getElementById('v8PinInput').value='';document.getElementById('v8PinError').textContent='';document.getElementById('v8PinOverlay').classList.add('open')}
function v8Unlock(){const v=document.getElementById('v8PinInput').value;if(v===db.settings.pin){document.getElementById('v8PinOverlay').classList.remove('open');home()}else document.getElementById('v8PinError').textContent='PIN اشتباه است.'}
function v8Init(){document.title=db.settings.appName||'Decorative Pro';const brand=document.querySelector('.brand span');if(brand)brand.textContent=db.settings.appName||'Decorative Pro';if(db.settings.pinEnabled&&db.settings.pin){v8EnsurePinUI();setTimeout(()=>document.getElementById('v8PinOverlay').classList.add('open'),80)}}
setTimeout(v8Init,0);
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
</script>
